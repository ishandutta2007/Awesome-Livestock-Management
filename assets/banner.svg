<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Dark Tech Agriculture Gradient Background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="40%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#064E3B" />
    </linearGradient>

    <!-- Vibrant Emerald Text Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#6EE7B7" />
    </linearGradient>

    <!-- Accent Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <!-- Dynamic Pulse Filter Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.4; transform: scale(1); }
      50% { opacity: 0.8; transform: scale(1.05); }
    }
    @keyframes dashMove {
      0% { stroke-dashoffset: 100; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes floatSlow {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes radarSweep {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .bg { fill: url(#bgGrad); }
    .title { font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 50px; fill: url(#textGrad); filter: drop-shadow(0px 4px 12px rgba(16, 185, 129, 0.3)); }
    .subtitle { font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 20px; fill: #94A3B8; letter-spacing: 1px; }
    .badge-text { font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 700; font-size: 14px; fill: #0F172A; }
    .dynamic-circle { animation: pulseGlow 4s infinite ease-in-out; transform-origin: center; }
    .floating-group { animation: floatSlow 6s infinite ease-in-out; }
    .grid-line { stroke: #334155; stroke-width: 1; stroke-dasharray: 4 4; opacity: 0.5; }
    .pulse-line { stroke: #10B981; stroke-width: 2; stroke-dasharray: 12 6; animation: dashMove 3s linear infinite; }
  </style>

  <!-- Background Layer -->
  <rect class="bg" width="1200" height="320" rx="16" />

  <!-- Decorative AgTech Grid Lines -->
  <line x1="100" y1="0" x2="100" y2="320" class="grid-line" />
  <line x1="300" y1="0" x2="300" y2="320" class="grid-line" />
  <line x1="500" y1="0" x2="500" y2="320" class="grid-line" />
  <line x1="700" y1="0" x2="700" y2="320" class="grid-line" />
  <line x1="900" y1="0" x2="900" y2="320" class="grid-line" />
  <line x1="1100" y1="0" x2="1100" y2="320" class="grid-line" />

  <!-- Animated Ambient Circles -->
  <circle cx="1050" cy="80" r="140" fill="#10B981" class="dynamic-circle" opacity="0.15" filter="url(#glow)" />
  <circle cx="150" cy="240" r="100" fill="#059669" class="dynamic-circle" opacity="0.1" filter="url(#glow)" />

  <!-- Connected Pulse Line -->
  <path d="M 50 260 Q 250 200, 450 250 T 850 180 T 1150 220" fill="none" class="pulse-line" />

  <!-- Floating Main Content -->
  <g class="floating-group">
    <!-- Icon Container / Badge -->
    <g transform="translate(80, 75)">
      <rect x="0" y="0" width="80" height="80" rx="20" fill="#10B981" opacity="0.2" />
      <rect x="5" y="5" width="70" height="70" rx="16" fill="#047857" opacity="0.4" />
      <!-- Cow / Livestock Emoji Glyph Illustration -->
      <text x="40" y="52" font-size="44" text-anchor="middle">🐄</text>
    </g>

    <!-- Header Text -->
    <text x="180" y="115" class="title">Awesome Livestock Management 🌾</text>
    <text x="180" y="155" class="subtitle">Curated SaaS Platforms, Open-Source Tools & Smart AgTech Ecosystems</text>

    <!-- Tag Pills -->
    <g transform="translate(180, 190)">
      <!-- Pill 1: Cattle & Dairy -->
      <rect x="0" y="0" width="160" height="34" rx="17" fill="url(#goldGrad)" />
      <text x="80" y="22" class="badge-text" text-anchor="middle">🐮 Cattle &amp; Dairy</text>

      <!-- Pill 2: Herd Analytics -->
      <rect x="175" y="0" width="165" height="34" rx="17" fill="#34D399" />
      <text x="257" y="22" class="badge-text" text-anchor="middle">📊 Herd Analytics</text>

      <!-- Pill 3: IoT & Sensors -->
      <rect x="355" y="0" width="150" height="34" rx="17" fill="#6EE7B7" />
      <text x="430" y="22" class="badge-text" text-anchor="middle">📡 IoT &amp; Sensors</text>

      <!-- Pill 4: Open Source -->
      <rect x="520" y="0" width="150" height="34" rx="17" fill="#A7F3D0" />
      <text x="595" y="22" class="badge-text" text-anchor="middle">⚡ Open Source</text>
    </g>
  </g>

  <!-- Bottom Accent Bar -->
  <rect x="0" y="312" width="1200" height="8" fill="url(#textGrad)" />
</svg>
