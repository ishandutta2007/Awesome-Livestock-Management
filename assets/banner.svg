<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320">
  <defs>
    <!-- Dark Emerald Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#064E3B" />
    </linearGradient>

    <!-- Vibrant Mint Text Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <!-- Accent Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Pill 1 Gradient -->
    <linearGradient id="pillGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="320" rx="16" fill="url(#bgGrad)" />

  <!-- Decorative Grid Pattern & Lines -->
  <g stroke="#334155" stroke-width="1" stroke-dasharray="4 4" opacity="0.4">
    <line x1="120" y1="0" x2="120" y2="320" />
    <line x1="360" y1="0" x2="360" y2="320" />
    <line x1="600" y1="0" x2="600" y2="320" />
    <line x1="840" y1="0" x2="840" y2="320" />
    <line x1="1080" y1="0" x2="1080" y2="320" />
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="240" x2="1200" y2="240" />
  </g>

  <!-- Ambient Glow Circles (Pure SVG Opacity, No Filters) -->
  <circle cx="1020" cy="100" r="130" fill="#10B981" opacity="0.12" />
  <circle cx="150" cy="220" r="110" fill="#059669" opacity="0.1" />

  <!-- AgTech Pulse Line Artwork -->
  <path d="M 40 250 Q 200 190, 400 240 T 760 170 T 1160 210" fill="none" stroke="#10B981" stroke-width="3" stroke-dasharray="10 6" opacity="0.7" />
  <circle cx="400" cy="240" r="5" fill="#34D399" />
  <circle cx="760" cy="170" r="5" fill="#34D399" />
  <circle cx="1160" cy="210" r="5" fill="#34D399" />

  <!-- Left Icon Emblem Container -->
  <g transform="translate(70, 75)">
    <rect x="0" y="0" width="90" height="90" rx="20" fill="#10B981" opacity="0.2" />
    <rect x="6" y="6" width="78" height="78" rx="16" fill="#047857" opacity="0.5" />
    
    <!-- Vector Cow Silhouette Icon -->
    <g transform="translate(15, 15) scale(0.12)">
      <path fill="#34D399" d="M 420 120 C 380 120 340 140 310 170 C 280 140 240 120 200 120 C 130 120 70 170 60 240 L 40 260 C 20 280 20 310 40 330 L 70 360 C 90 380 120 380 140 360 L 150 350 C 170 410 230 460 300 460 C 370 460 430 410 450 350 L 460 360 C 480 380 510 380 530 360 L 560 330 C 580 310 580 280 560 260 L 540 240 C 530 170 470 120 420 120 Z M 210 300 C 190 300 175 285 175 265 C 175 245 190 230 210 230 C 230 230 245 245 245 265 C 245 285 230 300 210 300 Z M 410 300 C 390 300 375 285 375 265 C 375 245 390 230 410 230 C 430 230 445 245 445 265 C 445 285 430 300 410 300 Z" />
    </g>
  </g>

  <!-- Title Text -->
  <text x="185" y="118" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="46" font-weight="800" fill="url(#titleGrad)">Awesome Livestock Management</text>
  
  <!-- Subtitle Text -->
  <text x="185" y="156" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="19" font-weight="500" fill="#94A3B8">Curated SaaS Platforms, Open-Source Tools &amp; AgTech Ecosystems</text>

  <!-- Feature Pills -->
  <g transform="translate(185, 195)">
    <!-- Pill 1: Cattle & Dairy -->
    <rect x="0" y="0" width="160" height="34" rx="17" fill="url(#goldGrad)" />
    <text x="80" y="22" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle">Cattle &amp; Dairy</text>

    <!-- Pill 2: Herd Analytics -->
    <rect x="172" y="0" width="160" height="34" rx="17" fill="url(#pillGreen)" />
    <text x="252" y="22" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">Herd Analytics</text>

    <!-- Pill 3: IoT & Sensors -->
    <rect x="344" y="0" width="150" height="34" rx="17" fill="#334155" />
    <text x="419" y="22" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700" fill="#34D399" text-anchor="middle">IoT &amp; Sensors</text>

    <!-- Pill 4: Open Source -->
    <rect x="506" y="0" width="150" height="34" rx="17" fill="#047857" />
    <text x="581" y="22" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700" fill="#A7F3D0" text-anchor="middle">Open Source</text>
  </g>

  <!-- Bottom Accent Bar -->
  <rect x="0" y="312" width="1200" height="8" fill="url(#titleGrad)" />
</svg>
